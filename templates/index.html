<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tradutor em Tempo Real</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 800px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      overflow: hidden;
    }
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      text-align: center;
    }
    .header h1 {
      font-size: 1.8rem;
      margin-bottom: 5px;
    }
    .header p {
      opacity: 0.9;
      font-size: 0.9rem;
    }
    .nav-tabs {
      display: flex;
      background: #f5f5f5;
      border-bottom: 2px solid #ddd;
    }
    .nav-tab {
      flex: 1;
      padding: 15px;
      text-align: center;
      cursor: pointer;
      background: #f5f5f5;
      border: none;
      font-size: 1rem;
      font-weight: 500;
      transition: all 0.3s;
    }
    .nav-tab:hover {
      background: #e0e0e0;
    }
    .nav-tab.active {
      background: white;
      border-bottom: 3px solid #667eea;
      color: #667eea;
    }
    .translator-content {
      padding: 30px;
    }
    .language-selector {
      display: flex;
      gap: 20px;
      margin-bottom: 25px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
    }
    .lang-select-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .lang-select-group label {
      font-weight: 600;
      color: #555;
      font-size: 0.9rem;
    }
    select {
      padding: 12px 20px;
      border-radius: 25px;
      border: 2px solid #e0e0e0;
      font-size: 1rem;
      cursor: pointer;
      background: white;
      transition: border-color 0.3s;
      min-width: 200px;
    }
    select:focus {
      outline: none;
      border-color: #667eea;
    }
    .mic-control {
      text-align: center;
      margin: 30px 0;
    }
    #startBtn {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: none;
      font-size: 3rem;
      cursor: pointer;
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      color: white;
      transition: all 0.3s;
      box-shadow: 0 10px 30px rgba(245, 87, 108, 0.3);
    }
    #startBtn:hover {
      transform: scale(1.05);
      box-shadow: 0 15px 40px rgba(245, 87, 108, 0.5);
    }
    #startBtn.active {
      animation: pulse 1.5s infinite;
      background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }
    .translation-display {
      display: flex;
      justify-content: center;
      margin: 30px 0;
      min-height: 300px;
    }
    .display-panel {
      background: #f9f9f9;
      border-radius: 15px;
      padding: 20px;
      border: 2px solid #e0e0e0;
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 600px;
    }
    .panel-title {
      font-weight: 600;
      color: #667eea;
      font-size: 1.1rem;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .text-content {
      flex: 1;
      font-size: 1.5rem;
      line-height: 1.6;
      color: #333;
      overflow-y: auto;
      padding: 10px;
      text-align: center;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 200px;
    }
    .interim {
      color: #999;
      font-style: italic;
    }
    .final {
      color: #333;
      font-weight: 500;
    }
    .status-bar {
      padding: 20px;
      background: #f5f5f5;
      border-radius: 15px;
      text-align: center;
      font-size: 1.1rem;
      color: #666;
      font-weight: 500;
    }
    .status-bar.listening {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      color: white;
      animation: fadeIn 0.3s;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .controls-bottom {
      display: flex;
      gap: 15px;
      justify-content: center;
      margin-top: 20px;
    }
    .btn-secondary {
      padding: 12px 24px;
      border: none;
      border-radius: 25px;
      font-size: 1rem;
      cursor: pointer;
      background: #667eea;
      color: white;
      transition: all 0.3s;
    }
    .btn-secondary:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }
    @media (max-width: 768px) {
      #startBtn {
        width: 100px;
        height: 100px;
        font-size: 2.5rem;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>🌍 Tradutor em Tempo Real</h1>
      <p>Fale e veja a tradução instantânea enquanto você fala</p>
    </div>

    <div class="nav-tabs">
      <button class="nav-tab" onclick="window.location.href='/'">Chat</button>
      <button class="nav-tab active">Tradutor</button>
    </div>

    <div class="translator-content">
      <div class="language-selector">
        <div class="lang-select-group">
          <label>🎤 Eu falo em</label>
          <select id="sourceLang" onchange="updateRecognitionLang()">
            <option value="pt-BR">🇧🇷 Português</option>
            <option value="en-US">🇺🇸 Inglês</option>
            <option value="es-ES">🇪🇸 Espanhol</option>
            <option value="fr-FR">🇫🇷 Francês</option>
            <option value="de-DE">🇩🇪 Alemão</option>
            <option value="it-IT">🇮🇹 Italiano</option>
            <option value="ja-JP">🇯🇵 Japonês</option>
            <option value="ko-KR">🇰🇷 Coreano</option>
            <option value="zh-CN">🇨🇳 Chinês</option>
          </select>
        </div>

        <div style="font-size: 2rem; color: #667eea;">→</div>

        <div class="lang-select-group">
          <label>🗣️ Traduzir para</label>
          <select id="targetLang">
            <option value="en-US">🇺🇸 Inglês</option>
            <option value="pt-BR">🇧🇷 Português</option>
            <option value="es-ES">🇪🇸 Espanhol</option>
            <option value="fr-FR">🇫🇷 Francês</option>
            <option value="de-DE">🇩🇪 Alemão</option>
            <option value="it-IT">🇮🇹 Italiano</option>
            <option value="ja-JP">🇯🇵 Japonês</option>
            <option value="ko-KR">🇰🇷 Coreano</option>
            <option value="zh-CN">🇨🇳 Chinês</option>
          </select>
        </div>
      </div>

      <div class="mic-control">
        <button id="startBtn" onclick="toggleTranslation()">🎤</button>
        <p style="margin-top: 15px; color: #666; font-size: 0.95rem;">Clique no microfone para começar</p>
      </div>

      <div class="translation-display">
        <div class="display-panel">
          <div class="panel-title">
            <span>✨</span>
            <span>Tradução em tempo real</span>
          </div>
          <div class="text-content" id="translatedText">
            <p style="color: #999;">A tradução aparecerá aqui...</p>
          </div>
        </div>
      </div>

      <div class="status-bar" id="statusBar">
        <span id="statusText">Pronto para começar - Clique no microfone</span>
      </div>

      <div class="controls-bottom">
        <button class="btn-secondary" onclick="clearAll()">
          🗑️ Limpar Tudo
        </button>
      </div>
    </div>
  </div>

  <script>
    let recognition = null;
    let isTranslating = false;
    let isTranslating_API = false;

    window.onload = function() {
      initializeRecognition();
    };

    function initializeRecognition() {
      if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
        updateStatus('❌ Reconhecimento de voz não suportado neste navegador', false);
        document.getElementById('startBtn').disabled = true;
        return;
      }

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.maxAlternatives = 1;
      recognition.lang = document.getElementById('sourceLang').value;

      recognition.onresult = function(event) {
        let interimTranscript = '';
        let finalTranscript = '';

        for (let i = event.resultIndex; i < event.results.length; i++) {
          const transcript = event.results[i][0].transcript;
          if (event.results[i].isFinal) {
            finalTranscript += transcript + ' ';
          } else {
            interimTranscript += transcript;
          }
        }

        // Traduz texto interim (para tempo real)
        if (interimTranscript.trim() && !isTranslating_API) {
          translateText(interimTranscript.trim(), true);
        }

        // Se há texto final, traduz (substituindo o anterior)
        if (finalTranscript.trim()) {
          translateText(finalTranscript.trim(), false);
        }
      };

      recognition.onerror = function(event) {
        console.error('Erro no reconhecimento:', event.error);
        if (event.error === 'no-speech') {
          updateStatus('🎤 Nenhuma fala detectada. Continue falando...', true);
        } else if (event.error === 'audio-capture') {
          updateStatus('❌ Erro no microfone. Verifique as permissões.', false);
          stopTranslation();
        } else {
          updateStatus('⚠️ Erro: ' + event.error, true);
        }
      };

      recognition.onend = function() {
        if (isTranslating) {
          recognition.start();
        }
      };
    }

    function updateRecognitionLang() {
      if (recognition && isTranslating) {
        recognition.stop();
        recognition.lang = document.getElementById('sourceLang').value;
        setTimeout(() => {
          if (isTranslating) {
            recognition.start();
          }
        }, 100);
      }
    }

    function toggleTranslation() {
      if (!recognition) {
        alert('Reconhecimento de voz não disponível');
        return;
      }

      if (isTranslating) {
        stopTranslation();
      } else {
        startTranslation();
      }
    }

    function startTranslation() {
      isTranslating = true;
      
      const startBtn = document.getElementById('startBtn');
      startBtn.classList.add('active');
      startBtn.textContent = '🛑';
      
      updateStatus('🎤 Escutando e traduzindo em tempo real...', true);
      
      document.getElementById('translatedText').innerHTML = '<p style="color: #999;">Comece a falar...</p>';

      recognition.lang = document.getElementById('sourceLang').value;
      recognition.start();
    }

    function stopTranslation() {
      isTranslating = false;
      
      const startBtn = document.getElementById('startBtn');
      startBtn.classList.remove('active');
      startBtn.textContent = '🎤';
      
      updateStatus('✅ Tradução pausada - Clique no microfone para continuar', false);
      
      if (recognition) {
        recognition.stop();
      }
    }

    async function translateText(text, isInterim = false) {
      if (!text.trim()) return;

      const targetLang = document.getElementById('targetLang').value;

      // Evita múltiplas chamadas simultâneas
      if (isTranslating_API && !isInterim) return;
      
      isTranslating_API = true;

      try {
        const response = await fetch('/translate', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            text: text,
            target_language: targetLang
          })
        });

        const data = await response.json();

        if (data.error) {
          throw new Error(data.error);
        }

        const translation = data.translation;
        
        // Atualiza a tradução
        const translatedDiv = document.getElementById('translatedText');
        
        if (isInterim) {
          // Mostra tradução provisória
          translatedDiv.innerHTML = `<span class="interim">${translation}</span>`;
        } else {
          // Substitui a tradução anterior pela nova
          translatedDiv.innerHTML = `<span class="final">${translation}</span>`;
        }

      } catch (error) {
        console.error('Erro na tradução:', error);
      } finally {
        isTranslating_API = false;
      }
    }

    function updateStatus(message, isListening) {
      const statusBar = document.getElementById('statusBar');
      const statusText = document.getElementById('statusText');
      
      statusText.textContent = message;
      
      if (isListening) {
        statusBar.classList.add('listening');
      } else {
        statusBar.classList.remove('listening');
      }
    }

    function clearAll() {
      document.getElementById('translatedText').innerHTML = '<p style="color: #999;">A tradução aparecerá aqui...</p>';
      
      if (isTranslating) {
        updateStatus('🎤 Escutando e traduzindo em tempo real...', true);
      } else {
        updateStatus('Pronto para começar - Clique no microfone', false);
      }
    }
  </script>

</body>
</html>
