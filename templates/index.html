<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chat com Sophia</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: #f9f9f9;
      color: #333;
    }
    #chatContainer {
      border: 1px solid #ccc;
      height: 300px;
      overflow-y: auto;
      padding: 10px;
      margin-bottom: 10px;
      background: #fff;
      border-radius: 6px;
    }
    .chat-message.user {
      text-align: right;
      background-color: #daf1da;
      margin: 5px 0;
      padding: 8px 12px;
      border-radius: 15px 15px 0 15px;
      display: inline-block;
      max-width: 75%;
      word-wrap: break-word;
    }
    .chat-message.assistant {
      text-align: left;
      background-color: #f1f0f0;
      margin: 5px 0;
      padding: 8px 12px;
      border-radius: 15px 15px 15px 0;
      display: inline-block;
      max-width: 75%;
      word-wrap: break-word;
    }
    textarea {
      width: 100%;
      box-sizing: border-box;
      resize: none;
      border-radius: 6px;
      padding: 10px;
      font-size: 1rem;
      border: 1px solid #ccc;
      height: 50px;
      transition: height 0.2s;
      font-family: inherit;
    }
    button {
      cursor: pointer;
      padding: 10px 15px;
      margin: 5px 5px 0 0;
      font-size: 1rem;
      border: none;
      border-radius: 6px;
      background-color: #007bff;
      color: white;
      transition: background-color 0.3s;
    }
    button:disabled {
      background-color: #a0c4ff;
      cursor: not-allowed;
    }
    #micBtn.listening {
      background-color: #dc3545;
    }
    #statusText {
      margin-top: 8px;
      font-style: italic;
      color: #555;
    }
    #langIndicator {
      margin-top: 4px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div id="chatContainer"></div>

  <textarea id="userInput" rows="3" placeholder="Digite sua mensagem ou use o microfone..."></textarea>
  <br />
  <button id="sendBtn" onclick="sendMessage()">Enviar ✨</button>
  <button id="micBtn" onclick="toggleListening()">🎤</button>

  <div id="statusText">Pronto para conversar</div>
  <div id="langIndicator">🇧🇷 Português detectado</div>

  <script>
    let messages = [];
    let isListening = false;
    let recognition = null;
    let currentLanguage = 'pt-BR';
    let availableVoices = [];

    window.onload = function() {
      initializeSpeech();
      setupTextarea();
    };

    function initializeSpeech() {
      function loadVoices() {
        availableVoices = speechSynthesis.getVoices();
      }
      
      loadVoices();
      speechSynthesis.onvoiceschanged = loadVoices;

      if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRecognition();
        recognition.continuous = false;
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;
      }
    }

    function setupTextarea() {
      const textarea = document.getElementById('userInput');
      if (!textarea) {
        console.error('Elemento userInput não encontrado!');
        return;
      }
      textarea.addEventListener('keypress', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });

      textarea.addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = Math.min(this.scrollHeight, 120) + 'px';
      });
    }

    function detectLanguage(text) {
      const portugueseWords = [
        'você', 'que', 'não', 'sim', 'como', 'onde', 'quando', 'porque', 'muito', 
        'bem', 'bom', 'dia', 'noite', 'obrigado', 'obrigada', 'por favor', 'com licença',
        'desculpa', 'oi', 'olá', 'tchau', 'até', 'logo', 'tudo', 'nada', 'alguma',
        'coisa', 'pessoa', 'gente', 'casa', 'trabalho', 'escola', 'família'
      ];
      const englishWords = [
        'the', 'and', 'you', 'that', 'was', 'for', 'are', 'with', 'his', 'they',
        'have', 'this', 'will', 'can', 'how', 'what', 'when', 'where', 'why',
        'hello', 'hi', 'bye', 'thank', 'please', 'sorry', 'good', 'morning',
        'evening', 'night', 'yes', 'no', 'maybe', 'people', 'work', 'school'
      ];

      const textLower = text.toLowerCase();
      const words = textLower.split(/\s+/);

      let ptScore = 0;
      let enScore = 0;

      words.forEach(word => {
        if (portugueseWords.includes(word)) ptScore++;
        if (englishWords.includes(word)) enScore++;
      });

      if (/ção|são|não|muito|também|português|brasileiro/.test(textLower)) {
        ptScore += 3;
      }
      if (/ing\b|tion\b|the\s|and\s|english|american/.test(textLower)) {
        enScore += 3;
      }

      const detectedLang = ptScore > enScore ? 'pt-BR' : 'en-US';
      currentLanguage = detectedLang;
      updateLanguageIndicator();
      return detectedLang;
    }

    function updateLanguageIndicator() {
      const indicator = document.getElementById('langIndicator');
      if (currentLanguage === 'pt-BR') {
        indicator.innerHTML = '🇧🇷 Português detectado';
      } else {
        indicator.innerHTML = '🇺🇸 English detected';
      }
    }

    function getBestVoice(language) {
      const voices = availableVoices.filter(voice => voice.lang.startsWith(language.split('-')[0]));
      
      if (language === 'pt-BR') {
        return voices.find(v => 
          v.lang === 'pt-BR' && 
          (v.name.toLowerCase().includes('luciana') || 
           v.name.toLowerCase().includes('fernanda') ||
           v.name.toLowerCase().includes('female') ||
           v.name.toLowerCase().includes('feminino'))
        ) || voices.find(v => v.lang === 'pt-BR') || voices[0];
      } else {
        return voices.find(v => 
          v.lang === 'en-US' && 
          (v.name.toLowerCase().includes('david') || 
           v.name.toLowerCase().includes('mark') ||
           v.name.toLowerCase().includes('male') ||
           v.name.toLowerCase().includes('masculino'))
        ) || voices.find(v => v.lang === 'en-US') || voices[0];
      }
    }

    function speakText(text, language) {
      if (!text.trim()) return;

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = language;
      
      const bestVoice = getBestVoice(language);
      if (bestVoice) {
        utterance.voice = bestVoice;
      }

      utterance.rate = 0.9;
      utterance.pitch = language === 'pt-BR' ? 1.1 : 0.9;
      utterance.volume = 1.0;

      speechSynthesis.speak(utterance);
    }

    function toggleListening() {
      if (!recognition) {
        updateStatus('Reconhecimento de voz não suportado neste navegador');
        return;
      }

      const micBtn = document.getElementById('micBtn');
      
      if (isListening) {
        recognition.stop();
        isListening = false;
        micBtn.classList.remove('listening');
        micBtn.innerHTML = '🎤';
        updateStatus('Pronto para conversar');
      } else {
        startListening();
      }
    }

    function startListening() {
      if (!recognition) return;

      const micBtn = document.getElementById('micBtn');
      recognition.lang = currentLanguage;

      recognition.onstart = function() {
        isListening = true;
        micBtn.classList.add('listening');
        micBtn.innerHTML = '🛑';
        updateStatus('Escutando...');
      };

      recognition.onresult = function(event) {
        const transcript = event.results[0][0].transcript;
        document.getElementById('userInput').value = transcript;
        
        isListening = false;
        micBtn.classList.remove('listening');
        micBtn.innerHTML = '🎤';
        
        detectLanguage(transcript);
        sendMessage();
      };

      recognition.onerror = function(event) {
        isListening = false;
        micBtn.classList.remove('listening');
        micBtn.innerHTML = '🎤';
        updateStatus('Erro no reconhecimento: ' + event.error);
      };

      recognition.onend = function() {
        isListening = false;
        micBtn.classList.remove('listening');
        micBtn.innerHTML = '🎤';
        updateStatus('Pronto para conversar');
      };

      recognition.start();
    }

    function updateStatus(message) {
      document.getElementById('statusText').textContent = message;
    }

    async function sendMessage() {
      const userInput = document.getElementById('userInput').value.trim();
      if (!userInput) return;

      const sendBtn = document.getElementById('sendBtn');

      const detectedLang = detectLanguage(userInput);

      addMessage(userInput, 'user');

      sendBtn.disabled = true;
      sendBtn.innerHTML = 'Enviando...';
      updateStatus('Pensando...');

      messages.push({
        role: "user",
        content: userInput
      });

      try {
        const response = await fetch('/chat', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            messages: messages,
            model: 'gpt-3.5-turbo'
          })
        });

        const data = await response.json();

        if (data.error) {
          throw new Error(data.error);
        }

        const assistantReply = data.response;

        messages.push({
          role: "assistant",
          content: assistantReply
        });

        addMessage(assistantReply, 'assistant');

        speakText(assistantReply, detectedLang);

      } catch (error) {
        console.error('Erro:', error);
        const errorMessage = currentLanguage === 'pt-BR' 
          ? 'Desculpe, houve um erro. Podemos tentar novamente?'
          : 'Sorry, there was an error. Shall we try again?';

        addMessage(errorMessage, 'assistant');
        speakText(errorMessage, detectedLang);
      }

      document.getElementById('userInput').value = '';
      document.getElementById('userInput').style.height = '50px';
      sendBtn.disabled = false;
      sendBtn.innerHTML = 'Enviar ✨';

      updateStatus('Pronto para conversar');
    }

    function addMessage(text, sender) {
      const chatContainer = document.getElementById('chatContainer');
      const messageDiv = document.createElement('div');
      messageDiv.className = `chat-message ${sender}`;
      messageDiv.textContent = text;
      
      chatContainer.appendChild(messageDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }
  </script>

</body>
</html>
