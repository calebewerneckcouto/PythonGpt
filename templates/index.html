<script>
    let messages = [];
    let isListening = false;
    let recognition = null;
    let currentLanguage = 'pt-BR';
    let availableVoices = [];

    // Inicialização
    window.onload = function() {
      initializeSpeech();
      setupTextarea();
    };

    function initializeSpeech() {
      // Carrega vozes disponíveis
      function loadVoices() {
        availableVoices = speechSynthesis.getVoices();
      }
      
      loadVoices();
      speechSynthesis.onvoiceschanged = loadVoices;

      // Configurar reconhecimento de voz
      if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRecognition();
        recognition.continuous = false;
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;
      }
    }

    function setupTextarea() {
      const textarea = document.getElementById('userInput');
      textarea.addEventListener('keypress', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });

      textarea.addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = Math.min(this.scrollHeight, 120) + 'px';
      });
    }

    function detectLanguage(text) {
      // Palavras-chave para português
      const portugueseWords = [
        'você', 'que', 'não', 'sim', 'como', 'onde', 'quando', 'porque', 'muito', 
        'bem', 'bom', 'dia', 'noite', 'obrigado', 'obrigada', 'por favor', 'com licença',
        'desculpa', 'oi', 'olá', 'tchau', 'até', 'logo', 'tudo', 'nada', 'alguma',
        'coisa', 'pessoa', 'gente', 'casa', 'trabalho', 'escola', 'família'
      ];

      // Palavras-chave para inglês
      const englishWords = [
        'the', 'and', 'you', 'that', 'was', 'for', 'are', 'with', 'his', 'they',
        'have', 'this', 'will', 'can', 'how', 'what', 'when', 'where', 'why',
        'hello', 'hi', 'bye', 'thank', 'please', 'sorry', 'good', 'morning',
        'evening', 'night', 'yes', 'no', 'maybe', 'people', 'work', 'school'
      ];

      const textLower = text.toLowerCase();
      const words = textLower.split(/\s+/);

      let ptScore = 0;
      let enScore = 0;

      words.forEach(word => {
        if (portugueseWords.includes(word)) ptScore++;
        if (englishWords.includes(word)) enScore++;
      });

      // Detecção adicional por padrões
      if (/ção|são|não|muito|também|português|brasileiro/.test(textLower)) {
        ptScore += 3;
      }
      if (/ing\b|tion\b|the\s|and\s|english|american/.test(textLower)) {
        enScore += 3;
      }

      const detectedLang = ptScore > enScore ? 'pt-BR' : 'en-US';
      currentLanguage = detectedLang;
      
      updateLanguageIndicator();
      return detectedLang;
    }

    function updateLanguageIndicator() {
      const indicator = document.getElementById('langIndicator');
      if (currentLanguage === 'pt-BR') {
        indicator.innerHTML = '🇧🇷 Português detectado';
      } else {
        indicator.innerHTML = '🇺🇸 English detected';
      }
    }

    function getBestVoice(language) {
      const voices = availableVoices.filter(voice => voice.lang.startsWith(language.split('-')[0]));
      
      if (language === 'pt-BR') {
        // Procurar voz feminina brasileira
        return voices.find(v => 
          v.lang === 'pt-BR' && 
          (v.name.toLowerCase().includes('luciana') || 
           v.name.toLowerCase().includes('fernanda') ||
           v.name.toLowerCase().includes('female') ||
           v.name.toLowerCase().includes('feminino'))
        ) || voices.find(v => v.lang === 'pt-BR') || voices[0];
      } else {
        // Procurar voz masculina americana
        return voices.find(v => 
          v.lang === 'en-US' && 
          (v.name.toLowerCase().includes('david') || 
           v.name.toLowerCase().includes('mark') ||
           v.name.toLowerCase().includes('male') ||
           v.name.toLowerCase().includes('masculino'))
        ) || voices.find(v => v.lang === 'en-US') || voices[0];
      }
    }

    function speakText(text, language) {
      if (!text.trim()) return;

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = language;
      
      const bestVoice = getBestVoice(language);
      if (bestVoice) {
        utterance.voice = bestVoice;
      }

      utterance.rate = 0.9;
      utterance.pitch = language === 'pt-BR' ? 1.1 : 0.9;
      utterance.volume = 1.0;

      speechSynthesis.speak(utterance);
    }

    function toggleListening() {
      if (!recognition) {
        updateStatus('Reconhecimento de voz não suportado neste navegador');
        return;
      }

      const micBtn = document.getElementById('micBtn');
      
      if (isListening) {
        recognition.stop();
        isListening = false;
        micBtn.classList.remove('listening');
        micBtn.innerHTML = '🎤';
        updateStatus('Pronto para conversar');
      } else {
        startListening();
      }
    }

    function startListening() {
      if (!recognition) return;

      const micBtn = document.getElementById('micBtn');
      recognition.lang = currentLanguage;

      recognition.onstart = function() {
        isListening = true;
        micBtn.classList.add('listening');
        micBtn.innerHTML = '🛑';
        updateStatus('Escutando...');
      };

      recognition.onresult = function(event) {
        const transcript = event.results[0][0].transcript;
        document.getElementById('userInput').value = transcript;
        
        isListening = false;
        micBtn.classList.remove('listening');
        micBtn.innerHTML = '🎤';
        
        // Detectar idioma do que foi falado
        detectLanguage(transcript);
        sendMessage();
      };

      recognition.onerror = function(event) {
        isListening = false;
        micBtn.classList.remove('listening');
        micBtn.innerHTML = '🎤';
        updateStatus('Erro no reconhecimento: ' + event.error);
      };

      recognition.onend = function() {
        isListening = false;
        micBtn.classList.remove('listening');
        micBtn.innerHTML = '🎤';
        updateStatus('Pronto para conversar');
      };

      recognition.start();
    }

    function updateStatus(message) {
      document.getElementById('statusText').textContent = message;
    }

    async function sendMessage() {
      const userInput = document.getElementById('userInput').value.trim();
      if (!userInput) return;

      const chatContainer = document.getElementById('chatContainer');
      const sendBtn = document.getElementById('sendBtn');

      // Detectar idioma da mensagem
      const detectedLang = detectLanguage(userInput);
      
      // Mostrar mensagem do usuário
      addMessage(userInput, 'user');

      // Desabilitar botão de envio
      sendBtn.disabled = true;
      sendBtn.innerHTML = 'Enviando...';
      updateStatus('Pensando...');

      // Adicionar mensagem do usuário ao histórico
      messages.push({
        role: "user",
        content: userInput
      });

      try {
        // Chamar a API real do OpenAI
        const response = await fetch('/chat', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            messages: messages,
            model: 'gpt-3.5-turbo'
          })
        });

        const data = await response.json();

        if (data.error) {
          throw new Error(data.error);
        }

        const assistantReply = data.response;
        
        // Adicionar resposta do assistente ao histórico
        messages.push({
          role: "assistant",
          content: assistantReply
        });

        addMessage(assistantReply, 'assistant');

        // Falar a resposta
        speakText(assistantReply, detectedLang);

      } catch (error) {
        console.error('Erro:', error);
        const errorMessage = currentLanguage === 'pt-BR' 
          ? 'Desculpe, houve um erro. Podemos tentar novamente?'
          : 'Sorry, there was an error. Shall we try again?';
        
        addMessage(errorMessage, 'assistant');
        speakText(errorMessage, detectedLang);
      }

      // Limpar input e reabilitar botão
      document.getElementById('userInput').value = '';
      document.getElementById('userInput').style.height = '50px';
      sendBtn.disabled = false;
      sendBtn.innerHTML = 'Enviar ✨';

      updateStatus('Pronto para conversar');
    }

    function addMessage(text, sender) {
      const chatContainer = document.getElementById('chatContainer');
      const messageDiv = document.createElement('div');
      messageDiv.className = `chat-message ${sender}`;
      messageDiv.textContent = text;
      
      chatContainer.appendChild(messageDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    // Função para obter a hora atual formatada
    function getCurrentTime() {
      const now = new Date();
      return now.toLocaleTimeString('pt-BR', { 
        hour: '2-digit', 
        minute: '2-digit',
        hour12: false 
      });
    }
</script>
